name: Publish Windows download

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build and publish learner ZIP
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the tagged version
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Set up the pinned pnpm version
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install locked frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build and test the learner interface
        shell: pwsh
        run: pnpm test

      - name: Build the Windows learner ZIP
        shell: pwsh
        run: ./scripts/build-release.ps1 -OutputPath ./KitCode-Windows.zip

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath ./KitCode-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KitCode-Windows.zip" | Set-Content -LiteralPath ./KitCode-Windows.zip.sha256 -Encoding ascii

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME `
              ./KitCode-Windows.zip `
              ./KitCode-Windows.zip.sha256 `
              --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME `
              ./KitCode-Windows.zip `
              ./KitCode-Windows.zip.sha256 `
              --title "KitCode $env:GITHUB_REF_NAME" `
              --generate-notes `
              --verify-tag
          }
