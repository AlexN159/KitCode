name: Publish Windows download

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build and publish learner ZIP
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out the tagged version
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python for the curriculum gate
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: Set up the pinned pnpm version
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Install locked frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build and test the learner interface
        shell: pwsh
        run: pnpm test

      # Keep this deliberately focused: it verifies the release catalogue,
      # every class-contract pathway, and independent Hard-exercise oracles
      # without rerunning the slower exhaustive per-fixture suites on a tag.
      - name: Verify the Python curriculum
        shell: pwsh
        run: |
          python -m pytest -q --maxfail=1 `
            tests/backend/test_main.py `
            tests/bank/test_exercise_bank.py `
            tests/bank/test_python_oop_curriculum.py `
            tests/bank/test_python_curated_354_393_audit.py `
            tests/bank/test_python_curated_201_288.py `
            tests/bank/test_python_curated_289_353.py `
            -k "catalogue_item_does_not_expose_class or release_catalogue or catalogue_has_breadth or every_exercise_has_a_private_test_floor or class_runner or class_harnesses or cross_level or real_class or promised_language or procedural_and_dummy or contiguous_hard or seeded or geometry_dp or line_tiling or final_tree or remaining_final or isomorphism or convex_ray or manifest_is_exactly or complete_runner_schema or data_only or representative_contracts or ids_schema or literal_fixtures or final_eight"

      - name: Build the Windows learner ZIP
        shell: pwsh
        run: ./scripts/build-release.ps1 -OutputPath ./KitCode-Windows.zip

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath ./KitCode-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KitCode-Windows.zip" | Set-Content -LiteralPath ./KitCode-Windows.zip.sha256 -Encoding ascii

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME `
              ./KitCode-Windows.zip `
              ./KitCode-Windows.zip.sha256 `
              --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME `
              ./KitCode-Windows.zip `
              ./KitCode-Windows.zip.sha256 `
              --title "KitCode $env:GITHUB_REF_NAME" `
              --generate-notes `
              --verify-tag
          }
